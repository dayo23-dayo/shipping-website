<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Global Shipping Logistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 { margin-bottom: 10px; color: #1a1a2e; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        .password-field { position: relative; margin: 10px 0; }
        .password-field input { margin: 0; padding-right: 72px; }
        .password-toggle {
            width: auto;
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            margin: 0;
            padding: 7px 9px;
            color: #1769e0;
            background: transparent;
            border-radius: 7px;
            font-size: 12px;
        }
        .password-toggle:hover { color: #0b1d35; background: #eef5ff; }
        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        .error { color: #dc3545; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 Admin Access</h2>
        <p>Enter the admin password to continue</p>
        <form id="loginForm">
            <div class="password-field">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>
                <button class="password-toggle" id="passwordToggle" type="button" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <button type="submit">Login</button>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        passwordToggle.addEventListener('click', () => {
            const isVisible = passwordInput.type === 'text';
            passwordInput.type = isVisible ? 'password' : 'text';
            passwordToggle.textContent = isVisible ? 'Show' : 'Hide';
            passwordToggle.setAttribute('aria-pressed', String(!isVisible));
            passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const entered = passwordInput.value;
            const error = document.getElementById('errorMsg');
            error.innerText = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: entered }),
                });
                if (!response.ok) throw new Error('Invalid credentials');
                window.location.href = '/admin';
            } catch {
                error.innerText = '❌ Incorrect password. Access denied.';
            }
        });
    </script>
</body>
</html>
