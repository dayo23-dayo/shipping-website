<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Shipping Logistics Logo - Real Package</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .logo-container {
            width: 500px;
            height: 500px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            border: 3px solid #f5a623;
            overflow: hidden;
            position: relative;
        }
        .package-image {
            width: 100%;
            height: 60%;
            object-fit: cover;
            object-position: center;
        }
        .text-overlay {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95));
            width: 100%;
            text-align: center;
            padding: 20px 10px;
        }
        .company-name {
            color: white;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .company-name .line1 {
            font-size: 20px;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .company-name .line2 {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .company-name .line3 {
            font-size: 14px;
            color: #f5a623;
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .since {
            margin-top: 10px;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            font-style: italic;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        .est {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 5px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img class="package-image" src="https://images.pexels.com/photos/4481259/pexels-photo-4481259.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Shipping package">
        <div class="text-overlay">
            <div class="company-name">
                <div class="line1">GLOBAL</div>
                <div class="line2">SHIPPING</div>
                <div class="line3">LOGISTICS</div>
            </div>
            <div class="since">
                <i>★ since 2023 ★</i>
            </div>
            <div class="est">TRUSTED DELIVERY WORLDWIDE</div>
        </div>
    </div>
</body>
</html>
